<svg width="240" height="111" viewBox="0 0 240 111" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes wave {
  0% { transform: rotate(-12deg); }
  100% { transform: rotate(12deg); }
}
.hand { transform-origin: 69px 63px; animation: wave 1.2s ease-in-out infinite alternate; }
@keyframes flyOut {
  0% { transform: translate(-115px, 37px) scale(0.35); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}
.airplane { transform-origin: 205px 20px; animation: flyOut 1.8s ease-out 0.3s both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fp1 { animation: fadeIn 0.3s ease-out 0.6s both; }
.fp2 { animation: fadeIn 0.3s ease-out 0.8s both; }
.fp3 { animation: fadeIn 0.3s ease-out 1.0s both; }
.fp4 { animation: fadeIn 0.3s ease-out 1.2s both; }
.fp5 { animation: fadeIn 0.3s ease-out 1.4s both; }
.fp6 { animation: fadeIn 0.3s ease-out 1.6s both; }
@media (prefers-reduced-motion: reduce) {
  .hand, .airplane, .fp1, .fp2, .fp3, .fp4, .fp5, .fp6 { animation: none; opacity: 1; }
}
</style>
